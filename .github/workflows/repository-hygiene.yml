name: Repository Hygiene

on:
  workflow_run:
    workflows: ["Release Windows Installer"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/repository-hygiene.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: repository-hygiene
  cancel-in-progress: true

jobs:
  cleanup:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Keep only recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $runs = gh run list --repo $env:GITHUB_REPOSITORY --limit 100 --json databaseId,status,createdAt | ConvertFrom-Json
          $old = $runs |
            Where-Object { $_.status -eq "completed" } |
            Sort-Object { [datetime]$_.createdAt } -Descending |
            Select-Object -Skip 8
          foreach ($run in $old) {
            gh run delete $run.databaseId --repo $env:GITHUB_REPOSITORY
          }
