name: Build

on:
  push:
    branches: [ main ]
    paths:
      - 'Baraban/**'
      - 'Baraban.sln'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Baraban/**'
      - 'Baraban.sln'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Baraban/Baraban.csproj
      - name: Build
        run: dotnet build Baraban/Baraban.csproj -c Release --no-restore
