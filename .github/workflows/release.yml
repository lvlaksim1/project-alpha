name: Release Windows

on:
  push:
    branches: [ main ]
    paths:
      - 'release/VERSION'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        shell: pwsh
        run: |
          $version = (Get-Content release/VERSION -Raw).Trim()
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish self-contained Windows x64
        shell: pwsh
        run: |
          dotnet restore Baraban/Baraban.csproj -r win-x64
          dotnet publish Baraban/Baraban.csproj -c Release -r win-x64 --self-contained true --no-restore -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Package
        shell: pwsh
        run: |
          $zip = "ProjectAlpha-v$env:VERSION-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path publish\* -DestinationPath $zip -CompressionLevel Optimal
          "ASSET=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          if (gh release view $tag 2>$null) {
            gh release upload $tag $env:ASSET --clobber
          } else {
            gh release create $tag $env:ASSET --target $env:GITHUB_SHA --title "Project Alpha $tag" --notes "Windows x64 self-contained build."
          }
