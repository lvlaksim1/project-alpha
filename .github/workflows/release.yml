name: Release Windows Installer

on:
  push:
    branches: [ main ]
    paths:
      - 'release/VERSION'

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        shell: pwsh
        run: |
          $version = (Get-Content release/VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'release/VERSION must be semantic numeric X.Y.Z' }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TARGET_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate update scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content .\scripts\create-publish-manifest.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content .\scripts\build-delta-update.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content .\scripts\build-cumulative-repair.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content .\scripts\update\Apply-Update.ps1 -Raw)) | Out-Null

      - name: Validate updater in Windows PowerShell 5.1
        shell: powershell
        run: |
          [scriptblock]::Create((Get-Content .\scripts\update\Apply-Update.ps1 -Raw)) | Out-Null

      - name: Publish current self-contained Windows x64
        shell: pwsh
        run: |
          dotnet restore Baraban/Baraban.csproj -r win-x64
          dotnet publish Baraban/Baraban.csproj -c Release -r win-x64 --self-contained true --no-restore -p:DebugType=None -p:DebugSymbols=false -p:Version=$env:VERSION -o publish

      - name: Create exact target publish manifest
        shell: pwsh
        run: |
          .\scripts\create-publish-manifest.ps1 `
            -PublishDir .\publish `
            -Tag $env:TARGET_TAG `
            -Commit "${{ github.sha }}" `
            -OutputPath .\ProjectAlpha-PublishManifest.json

      - name: Discover installable base versions from Git history
        shell: pwsh
        run: |
          $seen = @{}
          $bases = New-Object System.Collections.Generic.List[object]
          foreach ($sha in @(git log --format=%H -- release/VERSION)) {
            $raw = git show "${sha}:release/VERSION" 2>$null
            if ($LASTEXITCODE -ne 0) { continue }
            $versionText = ($raw | Out-String).Trim()
            if ($versionText -notmatch '^\d+\.\d+\.\d+$') { continue }
            $v = [version]$versionText
            if ($v -lt [version]'0.3.0' -or $v -ge [version]$env:VERSION) { continue }
            if ($seen.ContainsKey($versionText)) { continue }
            $seen[$versionText] = $true
            $bases.Add([pscustomobject]@{ version = $versionText; tag = "v$versionText"; commit = $sha })
          }

          $bases = @($bases | Sort-Object { [version]$_.version })
          if ($bases.Count -eq 0) { throw 'No installable base versions were discovered.' }
          $bases | ConvertTo-Json -Depth 4 | Set-Content .\release-bases.json -Encoding UTF8
          Write-Host ('Supported bases: ' + (($bases | ForEach-Object { $_.tag }) -join ', '))

      - name: Build cumulative delta staging from exact manifests
        shell: pwsh
        run: |
          $bases = @(Get-Content .\release-bases.json -Raw | ConvertFrom-Json)
          New-Item -ItemType Directory -Force .\delta-staging\bases | Out-Null
          New-Item -ItemType Directory -Force .\base-publishes | Out-Null

          foreach ($base in $bases) {
            $safe = $base.tag -replace '[^A-Za-z0-9._-]', '_'
            $worktree = Join-Path $PWD ("worktree-" + $safe)
            $basePublish = Join-Path $PWD ("base-publishes\" + $safe)
            $deltaDir = Join-Path $PWD ("delta-staging\bases\" + $safe)
            $storedManifest = Join-Path $PWD ("release\manifests\" + $base.tag + ".json")

            git worktree add --detach $worktree $base.commit
            try {
              dotnet restore (Join-Path $worktree 'Baraban\Baraban.csproj') -r win-x64
              dotnet publish (Join-Path $worktree 'Baraban\Baraban.csproj') -c Release -r win-x64 --self-contained true --no-restore -p:DebugType=None -p:DebugSymbols=false -p:Version=$($base.version) -o $basePublish

              if (Test-Path -LiteralPath $storedManifest -PathType Leaf) {
                Write-Host "Using persisted exact manifest for $($base.tag)"
                .\scripts\build-delta-update.ps1 `
                  -BaseManifestPath $storedManifest `
                  -CurrentPublishDir .\publish `
                  -BaseTag $base.tag `
                  -TargetTag $env:TARGET_TAG `
                  -TargetCommit "${{ github.sha }}" `
                  -OutputDirectory $deltaDir
              }
              else {
                Write-Warning "No persisted exact manifest for legacy $($base.tag); using reconstructed publish."
                .\scripts\build-delta-update.ps1 `
                  -BasePublishDir $basePublish `
                  -CurrentPublishDir .\publish `
                  -BaseTag $base.tag `
                  -TargetTag $env:TARGET_TAG `
                  -TargetCommit "${{ github.sha }}" `
                  -OutputDirectory $deltaDir
              }
            }
            finally {
              git worktree remove --force $worktree
            }
          }

          Copy-Item .\scripts\update\Apply-Update.ps1 .\delta-staging\Apply-Update.ps1 -Force

          .\scripts\build-cumulative-repair.ps1 `
            -CurrentPublishDir .\publish `
            -TargetManifestPath .\ProjectAlpha-PublishManifest.json `
            -DeltaBasesRoot .\delta-staging\bases `
            -BasesJsonPath .\release-bases.json `
            -TargetTag $env:TARGET_TAG `
            -OutputDirectory .\delta-staging

      - name: Smoke-test cumulative delta from every supported base
        shell: pwsh
        run: |
          $bases = @(Get-Content .\release-bases.json -Raw | ConvertFrom-Json)
          $expectedRoot = (Resolve-Path .\publish).Path.TrimEnd('\')
          $expected = @{}
          Get-ChildItem -LiteralPath $expectedRoot -File -Recurse | ForEach-Object {
            $rel = $_.FullName.Substring($expectedRoot.Length).TrimStart('\')
            $expected[$rel] = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
          }

          foreach ($base in $bases) {
            $safe = $base.tag -replace '[^A-Za-z0-9._-]', '_'
            $basePublish = Join-Path $PWD ("base-publishes\" + $safe)
            $testInstall = Join-Path $PWD ("test-install-" + $safe)
            New-Item -ItemType Directory -Path $testInstall -Force | Out-Null
            Copy-Item -Path (Join-Path $basePublish '*') -Destination $testInstall -Recurse -Force

            $errorPath = Join-Path $PWD ("error-" + $safe + '.txt')
            & .\delta-staging\Apply-Update.ps1 -InstallDir $testInstall -NoLaunch -ErrorPath $errorPath
            if ($LASTEXITCODE -ne 0) {
              $detail = if (Test-Path $errorPath) { Get-Content $errorPath -Raw } else { 'no error detail' }
              throw "Cumulative delta failed for $($base.tag): $detail"
            }

            $actualRoot = (Resolve-Path $testInstall).Path.TrimEnd('\')
            $actual = @{}
            Get-ChildItem -LiteralPath $actualRoot -File -Recurse | ForEach-Object {
              $rel = $_.FullName.Substring($actualRoot.Length).TrimStart('\')
              $actual[$rel] = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            }

            if ($expected.Count -ne $actual.Count) {
              throw "File-count mismatch after $($base.tag) update: expected $($expected.Count), actual $($actual.Count)"
            }
            foreach ($path in $expected.Keys) {
              if (-not $actual.ContainsKey($path)) { throw "Missing after $($base.tag) update: $path" }
              if ($actual[$path] -ne $expected[$path]) { throw "Hash mismatch after $($base.tag) update: $path" }
            }
          }


      - name: Smoke-test safe repair path on a hybrid legacy install
        shell: pwsh
        run: |
          $bases = @(Get-Content .\release-bases.json -Raw | ConvertFrom-Json | Sort-Object { [version]$_.version })
          if ($bases.Count -ge 2) {
            $firstSafe = $bases[0].tag -replace '[^A-Za-z0-9._-]', '_'
            $secondSafe = $bases[1].tag -replace '[^A-Za-z0-9._-]', '_'
            $hybrid = Join-Path $PWD 'test-install-hybrid'
            New-Item -ItemType Directory -Path $hybrid -Force | Out-Null
            Copy-Item -Path (Join-Path $PWD ("base-publishes\" + $firstSafe + "\*")) -Destination $hybrid -Recurse -Force

            $donorDll = Join-Path $PWD ("base-publishes\" + $secondSafe + "\Baraban.dll")
            if (-not (Test-Path -LiteralPath $donorDll -PathType Leaf)) { throw 'Hybrid repair donor Baraban.dll is missing.' }
            Copy-Item -LiteralPath $donorDll -Destination (Join-Path $hybrid 'Baraban.dll') -Force

            $errorPath = Join-Path $PWD 'error-hybrid.txt'
            & .\delta-staging\Apply-Update.ps1 -InstallDir $hybrid -NoLaunch -ErrorPath $errorPath
            if ($LASTEXITCODE -ne 0) {
              $detail = if (Test-Path $errorPath) { Get-Content $errorPath -Raw } else { 'no error detail' }
              throw "Safe repair path failed: $detail"
            }

            $targetManifest = Get-Content .\ProjectAlpha-PublishManifest.json -Raw | ConvertFrom-Json
            foreach ($entry in @($targetManifest.files | Where-Object { -not $_.mutable })) {
              $path = Join-Path $hybrid (([string]$entry.path).Replace('/', '\'))
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Hybrid repair missing target file: $($entry.path)" }
              $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($hash -ne ([string]$entry.sha256).ToLowerInvariant()) { throw "Hybrid repair hash mismatch: $($entry.path)" }
            }
          }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Locate Inno Setup compiler
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe was not found after Inno Setup installation' }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build cumulative single-file updater
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-output | Out-Null
          $source = (Resolve-Path delta-staging).Path
          $output = (Resolve-Path release-output).Path
          $args = @(
            "/DToVersion=$env:VERSION",
            "/DSourceDir=$source",
            "/DOutputDir=$output",
            'installer\ProjectAlphaUpdate.iss'
          )
          & $env:ISCC @args
          if ($LASTEXITCODE -ne 0) { throw "Cumulative updater compilation failed: $LASTEXITCODE" }

          $asset = Join-Path $output ("ProjectAlpha-Update-to-v" + $env:VERSION + '.exe')
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Update EXE not found: $asset" }
          "UPDATE_ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build fallback full installer
        shell: pwsh
        run: |
          $source = (Resolve-Path publish).Path
          $output = (Resolve-Path release-output).Path
          $args = @(
            "/DMyAppVersion=$env:VERSION",
            "/DSourceDir=$source",
            "/DOutputDir=$output",
            'installer\ProjectAlpha.iss'
          )
          & $env:ISCC @args
          if ($LASTEXITCODE -ne 0) { throw "Full installer compilation failed: $LASTEXITCODE" }
          $installer = Get-ChildItem release-output -Filter "ProjectAlpha-Setup-v$env:VERSION-win-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw 'Full installer output was not found' }
          "SETUP_ASSET=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Smoke-test EXE updater and uninstall data preservation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest = @(Get-Content .\release-bases.json -Raw | ConvertFrom-Json | Sort-Object { [version]$_.version } -Descending)[0]
          $baseSetupDir = Join-Path $PWD 'base-setup'
          New-Item -ItemType Directory -Path $baseSetupDir -Force | Out-Null
          gh release download $latest.tag --repo $env:GITHUB_REPOSITORY --pattern 'ProjectAlpha-Setup-*.exe' --dir $baseSetupDir --clobber
          $baseSetup = Get-ChildItem -LiteralPath $baseSetupDir -Filter 'ProjectAlpha-Setup-*.exe' | Select-Object -First 1
          if (-not $baseSetup) { throw 'Previous full Setup asset was not found.' }

          $p = Start-Process -FilePath $baseSetup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Previous Setup install failed: $($p.ExitCode)" }

          $sentinelDir = Join-Path $env:LOCALAPPDATA 'Baraban'
          New-Item -ItemType Directory -Path $sentinelDir -Force | Out-Null
          $sentinel = Join-Path $sentinelDir 'uninstall-preserve-test.txt'
          Set-Content -LiteralPath $sentinel -Value 'preserve'

          $p = Start-Process -FilePath $env:UPDATE_ASSET -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Cumulative Update EXE failed: $($p.ExitCode)" }
          Stop-Process -Name 'Baraban' -Force -ErrorAction SilentlyContinue

          $uninstallRoot = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $entries = @(Get-ChildItem -LiteralPath $uninstallRoot | Get-ItemProperty | Where-Object { $_.DisplayName -eq 'Project Alpha' })
          if ($entries.Count -ne 1) { throw "Expected exactly one Project Alpha uninstall entry, found $($entries.Count)." }
          if ([string]$entries[0].DisplayVersion -ne $env:VERSION) { throw "Uninstall entry version mismatch: '$($entries[0].DisplayVersion)' != '$env:VERSION'." }

          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Project Alpha'
          $uninstaller = Get-ChildItem -LiteralPath $installDir -Filter 'unins*.exe' | Sort-Object Name | Select-Object -First 1
          if (-not $uninstaller) { throw 'Inno uninstaller not found after update.' }
          $p = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent uninstall failed: $($p.ExitCode)" }
          if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf)) { throw 'Silent uninstall unexpectedly deleted user data.' }
          Remove-Item -LiteralPath $sentinelDir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Publish cumulative EXE update directly to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TARGET_TAG
          $assets = @($env:UPDATE_ASSET, $env:SETUP_ASSET)
          $notes = 'Normal update: run the single ProjectAlpha-Update-to-vX.Y.Z.exe file. It automatically detects any supported installed Project Alpha version from v0.3.0 onward. Full Setup.exe is only for first installation or recovery.'
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            foreach ($asset in $assets) { gh release upload $tag $asset --repo $env:GITHUB_REPOSITORY --clobber }
          } else {
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Project Alpha $tag" --notes $notes
          }

      - name: Persist exact publish manifest in Git
        shell: pwsh
        run: |
          $savedManifest = Join-Path $env:RUNNER_TEMP 'ProjectAlpha-PublishManifest.json'
          Copy-Item -LiteralPath .\ProjectAlpha-PublishManifest.json -Destination $savedManifest -Force

          git fetch origin main
          git checkout -B main origin/main

          $manifestDir = Join-Path $PWD 'release\manifests'
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          $relativeDestination = 'release/manifests/' + $env:TARGET_TAG + '.json'
          $destination = Join-Path $PWD ($relativeDestination.Replace('/', '\'))
          Copy-Item -LiteralPath $savedManifest -Destination $destination -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $relativeDestination
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Exact publish manifest already persisted.'
          }
          else {
            git commit -m "Record exact publish manifest $env:TARGET_TAG [skip ci]"
            git push origin main
          }
