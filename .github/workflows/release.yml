name: Release Windows Installer

on:
  push:
    branches: [ main ]
    paths:
      - 'release/VERSION'

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        shell: pwsh
        run: |
          $version = (Get-Content release/VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "release/VERSION must be semantic numeric X.Y.Z"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TARGET_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate update scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content .\scripts\build-delta-update.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content .\scripts\update\Apply-Update.ps1 -Raw)) | Out-Null

      - name: Publish current self-contained Windows x64
        shell: pwsh
        run: |
          dotnet restore Baraban/Baraban.csproj -r win-x64
          dotnet publish Baraban/Baraban.csproj -c Release -r win-x64 --self-contained true --no-restore -p:DebugType=None -p:DebugSymbols=false -p:Version=$env:VERSION -o publish

      - name: Find previous release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rows = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 20 --json tagName,publishedAt,isDraft | ConvertFrom-Json) |
            Where-Object { -not $_.isDraft -and $_.tagName -ne $env:TARGET_TAG } |
            Sort-Object { [DateTimeOffset]$_.publishedAt } -Descending

          $previous = $rows | Select-Object -First 1
          if ($null -eq $previous) {
            throw "Previous release is required for an incremental update."
          }

          $view = gh release view $previous.tagName --repo $env:GITHUB_REPOSITORY --json targetCommitish | ConvertFrom-Json
          "BASE_TAG=$($previous.tagName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BASE_COMMIT=$($view.targetCommitish)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Base release: $($previous.tagName) @ $($view.targetCommitish)"

      - name: Reconstruct previous publish
        shell: pwsh
        run: |
          $worktree = Join-Path $PWD "previous-release"
          $basePublish = Join-Path $PWD "publish-base"
          git worktree add --detach $worktree $env:BASE_COMMIT

          try {
            $baseVersion = (Get-Content (Join-Path $worktree "release\VERSION") -Raw).Trim()
            dotnet restore (Join-Path $worktree "Baraban\Baraban.csproj") -r win-x64
            dotnet publish (Join-Path $worktree "Baraban\Baraban.csproj") -c Release -r win-x64 --self-contained true --no-restore -p:DebugType=None -p:DebugSymbols=false -p:Version=$baseVersion -o $basePublish
          }
          finally {
            git worktree remove --force $worktree
          }

      - name: Build delta staging
        shell: pwsh
        run: |
          .\scripts\build-delta-update.ps1 `
            -BasePublishDir .\publish-base `
            -CurrentPublishDir .\publish `
            -BaseTag $env:BASE_TAG `
            -TargetTag $env:TARGET_TAG `
            -TargetCommit "${{ github.sha }}" `
            -OutputDirectory .\delta-staging

      - name: Smoke-test delta application
        shell: pwsh
        run: |
          $testInstall = Join-Path $PWD "test-install"
          Copy-Item -Path .\publish-base -Destination $testInstall -Recurse -Force

          & .\delta-staging\Apply-Update.ps1 -InstallDir $testInstall -NoLaunch

          $expectedRoot = (Resolve-Path .\publish).Path.TrimEnd('\')
          $actualRoot = (Resolve-Path $testInstall).Path.TrimEnd('\')

          $expected = @{}
          Get-ChildItem -LiteralPath $expectedRoot -File -Recurse | ForEach-Object {
            $rel = $_.FullName.Substring($expectedRoot.Length).TrimStart('\')
            $expected[$rel] = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
          }

          $actual = @{}
          Get-ChildItem -LiteralPath $actualRoot -File -Recurse | ForEach-Object {
            $rel = $_.FullName.Substring($actualRoot.Length).TrimStart('\')
            $actual[$rel] = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
          }

          if ($expected.Count -ne $actual.Count) {
            throw "Delta smoke test file-count mismatch: expected $($expected.Count), actual $($actual.Count)"
          }

          foreach ($path in $expected.Keys) {
            if (-not $actual.ContainsKey($path)) { throw "Delta smoke test missing file: $path" }
            if ($actual[$path] -ne $expected[$path]) { throw "Delta smoke test hash mismatch: $path" }
          }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Locate Inno Setup compiler
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found after Inno Setup installation" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build single-file incremental updater
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-output | Out-Null
          $fromVersion = $env:BASE_TAG.TrimStart('v')
          $source = (Resolve-Path delta-staging).Path
          $output = (Resolve-Path release-output).Path
          $args = @(
            "/DFromVersion=$fromVersion",
            "/DToVersion=$env:VERSION",
            "/DSourceDir=$source",
            "/DOutputDir=$output",
            "installer\ProjectAlphaUpdate.iss"
          )
          & $env:ISCC @args
          if ($LASTEXITCODE -ne 0) { throw "Incremental updater compilation failed: $LASTEXITCODE" }

          $name = "ProjectAlpha-Update-from-v$fromVersion-to-v$env:VERSION.exe"
          $asset = Join-Path $output $name
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Update EXE not found: $asset" }
          "UPDATE_ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build fallback full installer
        shell: pwsh
        run: |
          $source = (Resolve-Path publish).Path
          $output = (Resolve-Path release-output).Path
          $args = @(
            "/DMyAppVersion=$env:VERSION",
            "/DSourceDir=$source",
            "/DOutputDir=$output",
            "installer\ProjectAlpha.iss"
          )
          & $env:ISCC @args
          if ($LASTEXITCODE -ne 0) { throw "Full installer compilation failed: $LASTEXITCODE" }

          $installer = Get-ChildItem release-output -Filter "ProjectAlpha-Setup-v$env:VERSION-win-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "Full installer output was not found" }
          "SETUP_ASSET=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish EXE update directly to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TARGET_TAG
          $assets = @($env:UPDATE_ASSET, $env:SETUP_ASSET)
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            foreach ($asset in $assets) {
              gh release upload $tag $asset --repo $env:GITHUB_REPOSITORY --clobber
            }
          }
          else {
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Project Alpha $tag" --notes "Normal update: run the single ProjectAlpha-Update-from-...exe file. Full Setup.exe is retained only for first installation or recovery."
          }
