name: Release Windows Installer

on:
  push:
    branches: [ main ]
    paths:
      - 'release/VERSION'

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        shell: pwsh
        run: |
          $version = (Get-Content release/VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "release/VERSION must be semantic numeric X.Y.Z"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish self-contained Windows x64
        shell: pwsh
        run: |
          dotnet restore Baraban/Baraban.csproj -r win-x64
          dotnet publish Baraban/Baraban.csproj -c Release -r win-x64 --self-contained true --no-restore -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-output | Out-Null

          $candidates = @(
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe was not found after Inno Setup installation"
          }

          $source = (Resolve-Path publish).Path
          $output = (Resolve-Path release-output).Path

          & $iscc             "/DMyAppVersion=$env:VERSION"             "/DSourceDir=$source"             "/DOutputDir=$output"             "installer\ProjectAlpha.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

          $installer = Get-ChildItem release-output -Filter "ProjectAlpha-Setup-v$env:VERSION-win-x64.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer output was not found"
          }

          "ASSET=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish installer directly to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload $tag $env:ASSET --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $env:ASSET --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Project Alpha $tag" --notes "Windows x64 installer."
          }
